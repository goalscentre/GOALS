// ── BACKUP / RESTORE ──
function exportBackup() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  a.href = url; a.download = `goals_backup_${date}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('Còpia de seguretat exportada ✓');
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.months || !data.waitingList) throw new Error('Format invàlid');
        showModal(`
          <div class="modal-header"><h3>📥 Importar Còpia de Seguretat</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
          <div class="modal-body confirm-dialog">
            <p class="confirm-message">S&#39;importaran les dades de <strong>${file.name}</strong>.<br><br>
            Conté <strong>${Object.keys(data.months).length} mesos</strong> i <strong>${data.waitingList.length} persones a la llista d&#39;espera</strong>.<br><br>
            <span style="color:var(--red)">⚠ Això sobreescriurà totes les dades actuals.</span></p>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel·lar</button>
            <button class="btn btn-primary" onclick="confirmImportBackup()">📥 Importar</button>
          </div>
        `);
        window._pendingImport = data;
      } catch(err) {
        toast('Error: fitxer invàlid', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function confirmImportBackup() {
  if (!window._pendingImport) return;
  DB = window._pendingImport;
  saveData(); closeModal(); render();
  toast('Dades importades correctament ✓');
  delete window._pendingImport;
}

function createMonth() {
  const year = document.getElementById('m-year').value;
  const month = document.getElementById('m-month').value;
  const copyFrom = document.getElementById('m-copy').value;
  const key = `${year}-${month}`;
  if (DB.months[key]) { toast('Aquest mes ja existeix', 'error'); return; }
  const monthIdx = parseInt(month) - 1;
  const label = `${MONTH_NAMES[monthIdx]} ${year}`;

  let clients = [];
  if (copyFrom && DB.months[copyFrom]) {
    // Copy clients with reset payment status
    clients = DB.months[copyFrom].clients.filter(c => c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament').map(c => ({
      ...c, id: uid(), paid: 0, via: c.via || '01 Ingrés', estat: '01 Pendent', sessionsDone: 0
    }));
  }

  DB.months[key] = { label, clients, gastos: [] };
  DB.currentMonth = key;
  saveData(); closeModal(); render();
  toast(`${label} creat ✓`);
}

function exportCSV() {
  const month = getCurrentMonth();
  const clients = (month.clients || []).filter(c => c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament');
  const rows = [['Client','Sessions','Sessions Realitzades','€/Sessió','Total','Pagat','Pendent','Via','Estat','Notes']];
  clients.forEach(c => {
    const price = c.priceOverride != null ? c.priceOverride : getPrice(c.sessions);
    rows.push([c.name, c.sessions, c.sessionsDone||0, price.toFixed(2), clientTotal(c).toFixed(2), c.paid||0, clientPending(c).toFixed(2), c.via, c.estat, c.notes||'']);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `goals_${DB.currentMonth}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportat ✓');
}

async function generatePDF() {
  const year    = document.getElementById('pdf-year').value;
  const quarter = parseInt(document.getElementById('pdf-quarter').value);
  const inclIncome  = document.getElementById('pdf-include-income').checked;
  const inclGastos  = document.getElementById('pdf-include-gastos').checked;
  const inclDocs    = document.getElementById('pdf-include-docs').checked;
  const inclClients = document.getElementById('pdf-include-clients').checked;

  const months = [1,2,3].map(i => {
    const mNum = String((quarter-1)*3 + i).padStart(2,'0');
    return `${year}-${mNum}`;
  }).filter(k => DB.months[k]);

  if (months.length === 0) {
    toast('No hi ha dades per a aquest trimestre', 'error');
    return;
  }

  closeModal();
  toast('Generant PDF...', 'success');

  // Build HTML for PDF
  const quarterName = `T${quarter} ${year}`;
  const monthNames  = { '01':'Gener','02':'Febrer','03':'Març','04':'Abril','05':'Maig','06':'Juny','07':'Juliol','08':'Agost','09':'Setembre','10':'Octubre','11':'Novembre','12':'Desembre' };

  // Totals
  let grandIncome=0, grandExpenses=0, grandPending=0;
  months.forEach(k => {
    const m = DB.months[k];
    const active = (m.clients||[]).filter(c=>c.estat!=='99 No Aplica');
    grandIncome   += active.reduce((s,c)=>s+(c.paid||0),0);
    grandExpenses += (m.gastos||[]).reduce((s,g)=>s+(g.amount||0),0);
    grandPending  += active.reduce((s,c)=>s+clientPending(c),0);
  });
  const grandNet = grandIncome - grandExpenses;

  // Collect docs
  const allDocs = [];
  months.forEach(k => {
    const m = DB.months[k];
    const mLabel = monthNames[k.split('-')[1]] + ' ' + year;
    (m.gastos||[]).forEach(g => {
      if (g.docData) allDocs.push({ month: mLabel, type: g.type, amount: g.amount, docData: g.docData, docName: g.docName, docType: g.docType });
    });
  });

  let html = `
  <html><head><meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 11px; color: #222; margin: 0; padding: 20px; }
    h1 { font-size: 22px; color: #111; margin-bottom: 4px; }
    h2 { font-size: 14px; color: #333; margin: 20px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    h3 { font-size: 12px; color: #555; margin: 14px 0 6px; }
    .subtitle { font-size: 12px; color: #666; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    th { background: #f0f0f0; padding: 6px 10px; text-align: left; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 2px solid #ddd; }
    td { padding: 5px 10px; border-bottom: 1px solid #eee; }
    .total-row td { font-weight: bold; background: #f9f9f9; border-top: 2px solid #ddd; }
    .summary-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin: 16px 0; }
    .summary-card { background: #f7f7f7; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
    .card-label { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
    .card-value { font-size: 18px; font-weight: bold; }
    .green { color: #2a7a2a; } .red { color: #cc2222; } .orange { color: #cc7700; }
    .doc-img { max-width: 100%; max-height: 200px; border: 1px solid #ddd; border-radius: 4px; margin: 8px 0; }
    .page-break { page-break-before: always; }
    .doc-section { margin: 12px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
  </style></head><body>
  <h1>GOALS — Resum ${quarterName}</h1>
  <div class="subtitle">Generat el ${new Date().toLocaleDateString('ca-ES')} · ${months.length} mes${months.length>1?'os':''} inclosos</div>

  <div class="summary-grid">
    <div class="summary-card"><div class="card-label">Ingressos Cobrats</div><div class="card-value green">${fmt(grandIncome)}</div></div>
    <div class="summary-card"><div class="card-label">Total Gastos</div><div class="card-value red">${fmt(grandExpenses)}</div></div>
    <div class="summary-card"><div class="card-label">Resultat Net</div><div class="card-value ${grandNet>=0?'green':'red'}">${fmt(grandNet)}</div></div>
    <div class="summary-card"><div class="card-label">Pendent Cobrar</div><div class="card-value orange">${fmt(grandPending)}</div></div>
  </div>
  `;

  if (inclIncome) {
    html += `<h2>💰 Ingressos per Mes</h2>
    <table><thead><tr><th>Mes</th><th>Clients</th><th>Cobrat</th><th>Contractat</th><th>Pendent</th></tr></thead><tbody>`;
    months.forEach(k => {
      const m = DB.months[k];
      const mLabel = monthNames[k.split('-')[1]] + ' ' + year;
      const active = (m.clients||[]).filter(c=>c.estat!=='99 No Aplica');
      const income = active.reduce((s,c)=>s+(c.paid||0),0);
      const contracted = active.reduce((s,c)=>s+clientTotal(c),0);
      const pending = active.reduce((s,c)=>s+clientPending(c),0);
      html += `<tr><td>${mLabel}</td><td>${active.length}</td><td class="green">${fmt(income)}</td><td>${fmt(contracted)}</td><td class="${pending>0?'orange':''}">${pending>0?fmt(pending):'—'}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  if (inclGastos) {
    html += `<h2>💸 Gastos per Mes</h2>`;
    months.forEach(k => {
      const m = DB.months[k];
      const mLabel = monthNames[k.split('-')[1]] + ' ' + year;
      const gastos = m.gastos || [];
      if (gastos.length === 0) return;
      const total = gastos.reduce((s,g)=>s+(g.amount||0),0);
      html += `<h3>${mLabel}</h3>
      <table><thead><tr><th>Concepte</th><th>Import</th><th>Estat</th><th>Notes</th><th>Document</th></tr></thead><tbody>`;
      gastos.forEach(g => {
        html += `<tr>
          <td>${escH(g.type)}</td>
          <td class="red">${fmt(g.amount)}</td>
          <td>${g.estat==='02 Pagat'?'✓ Pagat':'⚠ Pendent'}</td>
          <td>${escH(g.notes||'')}</td>
          <td>${g.docData?`📎 ${escH(g.docName||'sí')}`:'—'}</td>
        </tr>`;
      });
      html += `<tr class="total-row"><td colspan="1">TOTAL ${mLabel}</td><td colspan="1" class="red">${fmt(total)}</td><td colspan="3"></td></tr>`;
      html += `</tbody></table>`;
    });
  }

  if (inclClients) {
    months.forEach(k => {
      const m = DB.months[k];
      const mLabel = monthNames[k.split('-')[1]] + ' ' + year;
      const active = (m.clients||[]).filter(c=>c.estat!=='99 No Aplica').sort((a,b)=>a.name.localeCompare(b.name));
      if (active.length === 0) return;
      html += `<h2>👥 Clients — ${mLabel}</h2>
      <table><thead><tr><th>Client</th><th>Cat.</th><th>Sessions</th><th>Total</th><th>Pagat</th><th>Pendent</th><th>Estat</th></tr></thead><tbody>`;
      active.forEach(c => {
        const pend = clientPending(c);
        html += `<tr>
          <td>${escH(c.name)}</td>
          <td>${escH(c.cat||'01')}</td>
          <td>${c.sessions}</td>
          <td>${fmt(clientTotal(c))}</td>
          <td class="green">${fmt(c.paid||0)}</td>
          <td class="${pend>0?'orange':''}">${pend>0?fmt(pend):'—'}</td>
          <td>${c.estat==='02 Pagat'?'✓ Pagat':'⚠ Pendent'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    });
  }

  if (inclDocs && allDocs.length > 0) {
    html += `<div class="page-break"></div><h2>📎 Documents Adjunts (Factures)</h2>`;
    allDocs.forEach(doc => {
      html += `<div class="doc-section">
        <strong>${escH(doc.month)} — ${escH(doc.type)}</strong> · ${fmt(doc.amount)}
        ${doc.docName ? `<br><span style="color:#666;font-size:10px">📎 ${escH(doc.docName)}</span>` : ''}
        ${doc.docType && doc.docType.startsWith('image/') ? `<br><img class="doc-img" src="${doc.docData}" />` : ''}
        ${doc.docType === 'application/pdf' ? `<br><span style="color:#336;font-size:11px">📄 Document PDF adjunt (obri el fitxer PDF per visualitzar-lo)</span>` : ''}
      </div>`;
    });
  }

  html += `</body></html>`;

  // Open print window
  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(html);
  win.document.close();
  win.onload = () => {
    win.print();
  };
}

// MODAL SYSTEM

function showModal(html) {
  const container = document.getElementById('modal-container');
  container.innerHTML = `<div class="modal-overlay" onclick="overlayClose(event)"><div class="modal">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
function overlayClose(e) { if (e.target.classList.contains('modal-overlay')) closeModal(); }

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function escH(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let fitxesSearch = '';

function buildClientMap() {
  const clientMap = {};
  Object.keys(DB.months).sort().forEach(mk => {
    const m = DB.months[mk];
    (m.clients||[]).forEach(c => {
      const key = c.name.trim().toLowerCase();
      if (!clientMap[key]) {
        clientMap[key] = { name: c.name, cat: c.cat||'01', genere: c.genere||'', mobil: c.mobil||'', email: c.email||'', notes: c.notes||'', history: [] };
      } else {
        if (c.mobil)  clientMap[key].mobil  = c.mobil;
        if (c.email)  clientMap[key].email  = c.email;
        if (c.genere) clientMap[key].genere = c.genere;
      }
      if (c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament') {
        clientMap[key].history.push({ monthKey: mk, monthLabel: m.label, sessions: c.sessions, sessionsDone: c.sessionsDone||0, paid: c.paid||0, total: clientTotal(c), pending: clientPending(c), estat: c.estat, cat: c.cat||'01' });
      }
    });
  });
  return clientMap;
}

function openEditClientGlobal(name) {
  const allMonthKeys = Object.keys(DB.months).sort().reverse();
  let found = null;
  for (const mk of allMonthKeys) {
    const c = (DB.months[mk].clients||[]).find(x => x.name.toLowerCase() === name.toLowerCase());
    if (c) { found = c; break; }
  }
  if (!found) { toast('Client no trobat', 'error'); return; }

  // Descompte global ve de DB.descomptes, NO del mes
  const currentDescompte = (DB.descomptes || {})[found.name.trim().toLowerCase()] || 0;

  showModal(
    '<div class="modal-header">' +
    '<h3>\u270F\uFE0F Editar Fitxa \u2014 ' + escH(found.name) + '</h3>' +
    '<button class="btn-icon" onclick="closeModal()">\u2715</button>' +
    '</div>' +
    '<div class="modal-body">' +
    '<p style="font-size:12px;color:var(--text2);margin-bottom:16px">Els canvis s\u2019aplicaran a totes les aparicions d\u2019aquest client.</p>' +
    '<div class="form-grid">' +
    '<div class="form-group">' +
    '<label>G\u00C8NERE <span style="color:var(--red)">*</span></label>' +
    '<select id="fg-genere">' +
    '<option value="" disabled ' + (!found.genere?'selected':'') + '>\u2014 Selecciona \u2014</option>' +
    '<option value="H" ' + (found.genere==='H'?'selected':'') + '>\uD83D\uDC68 Home</option>' +
    '<option value="D" ' + (found.genere==='D'?'selected':'') + '>\uD83D\uDC69 Dona</option>' +
    '</select>' +
    '</div>' +
    '<div class="form-group">' +
    '<label>N\u00BA M\u00D2BIL (9 d\u00EDgits)</label>' +
    '<input type="tel" id="fg-mobil" value="' + escH(found.mobil||'') + '" placeholder="612345678" maxlength="9" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,9)" />' +
    '</div>' +
    '<div class="form-group full">' +
    '<label>EMAIL</label>' +
    '<input type="email" id="fg-email" value="' + escH(found.email||'') + '" placeholder="nom@exemple.com" />' +
    '</div>' +
    '<div class="form-group">' +
    '<label>DESCOMPTE GLOBAL (%)</label>' +
    '<input type="number" id="fg-descompte" value="' + currentDescompte + '" min="0" max="100" step="1" placeholder="0" />' +
    '<span class="form-hint">S\u2019aplicar\u00E0 per defecte en afegir-lo al mes</span>' +
    '</div>' +
    '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel\u00B7lar</button>' +
    '<button class="btn btn-primary" onclick="saveGlobalClientContact(\'' + escH(name) + '\')">&#x1F4BE; Guardar</button>' +
    '</div>'
  );
}

function saveGlobalClientContact(name) {
  const genere = document.getElementById('fg-genere').value;
  if (!genere) { toast('El gènere és obligatori', 'error'); return; }
  const mobil = document.getElementById('fg-mobil').value.trim();
  if (mobil && !/^\d{9}$/.test(mobil)) { toast('El mòbil ha de tenir exactament 9 dígits', 'error'); return; }
  const email = document.getElementById('fg-email').value.trim();
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast('Format d\'email invàlid', 'error'); return; }
  const descompteGlobal = parseFloat(document.getElementById('fg-descompte').value) || 0;

  // Guardar descompte global separat (no afecta els mesos individuals)
  if (!DB.descomptes) DB.descomptes = {};
  DB.descomptes[name.trim().toLowerCase()] = descompteGlobal;

  // Actualitzar gènere, mòbil i email a tots els mesos (dades de contacte)
  // El descompte de cada mes NO es toca — és independent
  let updated = 0;
  Object.keys(DB.months).forEach(mk => {
    (DB.months[mk].clients||[]).forEach(c => {
      if (c.name.trim().toLowerCase() === name.trim().toLowerCase()) {
        c.genere = genere; c.mobil = mobil; c.email = email;
        // NO modifiquem c.descompte — és el descompte del mes concret
        updated++;
      }
    });
  });
  saveData(); closeModal(); render();
  toast('Fitxa actualitzada en ' + updated + ' mes' + (updated!==1?'os':'') + ' \u2713');
}

                style="padding:10px 20px;border:none;background:${detallTab===k+'-pendents'?'var(--surface)':'transparent'};color:${detallTab===k+'-pendents'?'var(--orange)':'var(--text2)'};font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid ${detallTab===k+'-pendents'?'var(--orange)':'transparent'};transition:all 0.15s">
                ⚠ Pendents (${pendingClients.length})
              </button>
              <button onclick="setDetallTab('${k}','gastos')" id="dtab-${k}-gastos"
                style="padding:10px 20px;border:none;background:${detallTab===k+'-gastos'?'var(--surface)':'transparent'};color:${detallTab===k+'-gastos'?'var(--red)':'var(--text2)'};font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid ${detallTab===k+'-gastos'?'var(--red)':'transparent'};transition:all 0.15s">
                💸 Gastos (${(m.gastos||[]).length})
              </button>
              ${m.tarifesSnapshot ? `
              <button onclick="setDetallTab('${k}','tarifes')" id="dtab-${k}-tarifes"
                style="padding:10px 20px;border:none;background:${detallTab===k+'-tarifes'?'var(--surface)':'transparent'};color:${detallTab===k+'-tarifes'?'var(--blue)':'var(--text2)'};font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid ${detallTab===k+'-tarifes'?'var(--blue)':'transparent'};transition:all 0.15s">
                💶 Tarifes
              </button>` : ''}
              <div style="flex:1;display:flex;justify-content:flex-end;align-items:center;padding-right:14px;gap:8px">
                <button class="btn btn-sm btn-secondary" onclick="changeMonth('${k}');navigate('clients')">
                  → Anar al mes
                </button>
              </div>
            </div>

            <!-- Contingut tab -->
            <div style="padding:0">
              ${renderDetallTab(k, m, clients, pendingClients)}
            </div>
          </div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

let detallTab = '';

function toggleDetallMonth(k) {
  if (detallOpenMonth === k) {
    detallOpenMonth = null;
  } else {
    detallOpenMonth = k;
    detallTab = k + '-clients';
  }
  renderDetall(document.getElementById('content'), document.getElementById('topbar-actions'));
}

function setDetallTab(k, tab) {
  detallTab = k + '-' + tab;
  renderDetall(document.getElementById('content'), document.getElementById('topbar-actions'));
}

function renderDetallTab(k, m, clients, pendingClients) {
  const activeTab = detallTab || (k + '-clients');

  if (activeTab === k + '-pendents') {
    if (pendingClients.length === 0) {
      return `<div class="empty-state" style="padding:30px"><div class="icon">✅</div><p>Cap client pendent en aquest mes</p></div>`;
    }
    return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--surface2)">
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">CLIENT</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">SESSIONS</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">TOTAL</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">PAGAT</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">PENDENT</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">VIA</th>
      </tr></thead>
      <tbody>
        ${pendingClients.map(c => `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:10px 14px;color:var(--orange);font-weight:600">${escH(c.name)}</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:12px">${c.sessions}</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:12px">${fmt(clientTotal(c))}</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:12px;color:var(--accent)">${fmt(c.paid)}</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:12px;color:var(--orange);font-weight:600">${fmt(clientPending(c))}</td>
          <td style="padding:10px 14px"><span style="font-size:11px;font-family:var(--font-mono);padding:2px 7px;border-radius:4px;background:var(--surface3);color:var(--text2)">${escH((c.via||'').replace('01 ','').replace('02 ',''))}</span></td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  if (activeTab === k + '-gastos') {
    const gastos = m.gastos || [];
    const total = gastos.reduce((s, g) => s + (g.amount || 0), 0);
    if (gastos.length === 0) {
      return `<div class="empty-state" style="padding:30px"><div class="icon">💸</div><p>Cap gasto registrat</p></div>`;
    }
    return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:var(--surface2)">
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">CONCEPTE</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">IMPORT</th>
        <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">ESTAT</th>
      </tr></thead>
      <tbody>
        ${gastos.map(g => `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:10px 14px;font-weight:500">${escH(g.type)}</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:13px;color:var(--red)">${fmt(g.amount)}</td>
          <td style="padding:10px 14px">${g.estat==='02 Pagat'?'<span class="badge badge-green">✓ Pagat</span>':'<span class="badge badge-orange">⚠ Pendent</span>'}</td>
        </tr>`).join('')}
        <tr style="background:var(--surface2);font-weight:600">
          <td style="padding:10px 14px">TOTAL</td>
          <td style="padding:10px 14px;font-family:var(--font-mono);font-size:13px;color:var(--red)">${fmt(total)}</td>
          <td></td>
        </tr>
      </tbody>
    </table></div>`;
  }

  // Default: tots els clients
  const sorted = [...clients].sort((a, b) => a.name.localeCompare(b.name));
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr style="background:var(--surface2)">
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">CLIENT</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">SESS.</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">REAL.</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">€/SESS</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">TOTAL</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">PAGAT</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">PENDENT</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">VIA</th>
      <th style="padding:10px 14px;text-align:left;font-size:11px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">ESTAT</th>
    </tr></thead>
    <tbody>
      ${sorted.map(c => {
        const price = c.priceOverride != null ? c.priceOverride : getPrice(c.sessions);
        const total = clientTotal(c);
        const pending = clientPending(c);
        const isPending = c.estat === '01 Pendent';
        return `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:9px 14px;font-weight:500;color:${isPending?'var(--orange)':'var(--text)'}">${escH(c.name)}${clientNotes(c)?`<br><span style="font-size:10px;color:var(--text3);font-style:italic">${escH(clientNotes(c))}</span>`:''}</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px">${c.sessions}</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px;color:var(--accent)">${c.sessionsDone||0}</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px">${price.toFixed(2)}€</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px">${fmt(total)}</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px;color:var(--accent)">${fmt(c.paid)}</td>
          <td style="padding:9px 14px;font-family:var(--font-mono);font-size:12px;color:${pending>0?'var(--orange)':'var(--text3)'}">${pending>0?fmt(pending):'—'}</td>
          <td style="padding:9px 14px"><span style="font-size:11px;font-family:var(--font-mono);padding:2px 7px;border-radius:4px;background:var(--surface3);color:var(--text2)">${escH((c.via||'').replace('01 ','').replace('02 ',''))}</span></td>
          <td style="padding:9px 14px">${clientEstatBadge(c)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;

  // ── TAB TARIFES ──
  if (activeTab === k + '-tarifes') {
    const snap = m.tarifesSnapshot;
    if (!snap) return '<div class="empty-state" style="padding:30px"><div class="icon">💶</div><p>No hi ha snapshot de tarifes per a aquest mes</p></div>';
    return '<div style="padding:20px;display:flex;flex-direction:column;gap:16px">' +
      '<div style="font-size:12px;color:var(--text2);background:var(--surface2);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">' +
      '📸 Tarifes vigents quan es va tancar aquest mes' +
      '</div>' +
      CATEGORIES.map(cat => {
        const rows = snap[cat.id] || [];
        if (!rows.length) return '';
        return '<div>' +
          '<div style="font-size:11px;font-family:var(--font-mono);color:var(--text3);letter-spacing:0.8px;margin-bottom:8px"><span class="' + cat.cls + ' cat-badge">' + cat.label + '</span></div>' +
          '<table style="width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)">' +
          '<thead><tr>' +
          '<th style="padding:8px 14px;text-align:left;font-size:10px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">DES DE</th>' +
          '<th style="padding:8px 14px;text-align:left;font-size:10px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">FINS A</th>' +
          '<th style="padding:8px 14px;text-align:left;font-size:10px;font-family:var(--font-mono);color:var(--text3);border-bottom:1px solid var(--border)">€/SESSIÓ</th>' +
          '</tr></thead><tbody>' +
          rows.map(r => '<tr style="border-bottom:1px solid var(--border)">' +
            '<td style="padding:8px 14px;font-family:var(--font-mono);font-size:12px">' + r.from + '</td>' +
            '<td style="padding:8px 14px;font-family:var(--font-mono);font-size:12px">' + (r.to === 999 ? '∞' : r.to) + '</td>' +
            '<td style="padding:8px 14px;font-family:var(--font-mono);font-size:12px;color:var(--accent)">' + r.price.toFixed(2) + ' €</td>' +
            '</tr>').join('') +
          '</tbody></table></div>';
      }).join('') +
      '</div>';
  }
}

let isMobileView = false;
let mobileTab = 'sessions';
let mobileSearch = '';
let mobileFilter = 'all';

function detectMobile() {
  return window.innerWidth <= 768;
}

function initViewMode() {
  if (detectMobile()) {
    activateMobileView();
  } else {
    activateDesktopView();
  }
}

function toggleMobileView() {
  if (isMobileView) {
    activateDesktopView();
  } else {
    activateMobileView();
  }
}

function activateMobileView() {
  isMobileView = true;
  document.getElementById('app').classList.add('mobile-hidden');
  document.getElementById('mobile-app').classList.add('active');
  document.getElementById('view-toggle-btn').textContent = '🖥️ Vista Escriptori';
  renderMobile();
}

function activateDesktopView() {
  isMobileView = false;
  document.getElementById('app').classList.remove('mobile-hidden');
  document.getElementById('mobile-app').classList.remove('active');
  document.getElementById('view-toggle-btn').textContent = '📱 Vista Mòbil';
  render();
}

function switchMobileTab(tab) {
  mobileTab = tab;
  document.querySelectorAll('.mobile-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.mtab === tab);
  });
  const toolbar = document.getElementById('mobile-toolbar');
  if (toolbar) toolbar.innerHTML = '';
  renderMobileContent();
}

function renderMobile() {
  // Month select
  const sel = document.getElementById('mobile-month-select');
  if (sel) {
    sel.innerHTML = '';
    Object.keys(DB.months).sort().forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = DB.months[k].label;
      if (k === DB.currentMonth) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  // Month label
  const lbl = document.getElementById('mobile-month-label');
  if (lbl && DB.months[DB.currentMonth]) lbl.textContent = DB.months[DB.currentMonth].label;
  renderMobileContent();
}

function renderMobileContent() {
  const container = document.getElementById('mobile-content');
  const toolbar   = document.getElementById('mobile-toolbar');
  if (!container) return;
  if (mobileTab === 'sessions') {
    renderMobileSessions(container);
  } else {
    if (toolbar) toolbar.innerHTML = '';
    if (mobileTab === 'pendents') renderMobilePendents(container);
    else if (mobileTab === 'gastos') renderMobileGastos(container);
    else if (mobileTab === 'resum')  renderMobileResum(container);
  }
}

function renderMobileSessions(container) {
  // Render fixed toolbar
  const toolbar = document.getElementById('mobile-toolbar');
  if (toolbar) renderMobileSessionsToolbar(toolbar);
  // Render scrollable cards
  renderMobileSessionsCards(container);
}

function renderMobileSessionsToolbar(toolbar) {
  const month = getCurrentMonth();
  const active = (month.clients||[]).filter(c => c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament');
  const totalPaid    = active.reduce((s,c) => s+(c.paid||0), 0);
  const totalPending = active.reduce((s,c) => s+clientPending(c), 0);
  const pendingCount = active.filter(c => c.estat==='01 Pendent').length;
  const totalSessions= active.reduce((s,c) => s+(c.sessions||0), 0);

  toolbar.innerHTML = `
    <div class="mobile-kpi-strip">
      <div class="mobile-kpi">
        <div class="mobile-kpi-label">Clients</div>
        <div class="mobile-kpi-value">${active.length}</div>
      </div>
      <div class="mobile-kpi">
        <div class="mobile-kpi-label">Sessions</div>
        <div class="mobile-kpi-value">${totalSessions}</div>
      </div>
      <div class="mobile-kpi">
        <div class="mobile-kpi-label">Cobrat</div>
        <div class="mobile-kpi-value" style="color:var(--accent)">${fmt(totalPaid)}</div>
      </div>
      <div class="mobile-kpi">
        <div class="mobile-kpi-label">Pendent</div>
        <div class="mobile-kpi-value" style="color:var(--orange)">${fmt(totalPending)}</div>
      </div>
    </div>
    <div class="mobile-search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar client..." value="${escH(mobileSearch)}"
        oninput="mobileSearch=this.value;renderMobileSessionsCards(document.getElementById('mobile-content'))" />
    </div>
    <div class="mobile-filter-strip">
      <span class="mobile-filter-pill ${mobileFilter==='all'?'active':''}" onclick="mobileFilter='all';renderMobileSessionsCards(document.getElementById('mobile-content'));renderMobileSessionsToolbar(document.getElementById('mobile-toolbar'))">Tots (${active.length})</span>
      <span class="mobile-filter-pill ${mobileFilter==='pagat'?'active':''}" onclick="mobileFilter='pagat';renderMobileSessionsCards(document.getElementById('mobile-content'));renderMobileSessionsToolbar(document.getElementById('mobile-toolbar'))">✓ Pagats (${active.filter(c=>c.estat==='02 Pagat').length})</span>
      <span class="mobile-filter-pill orange ${mobileFilter==='pendent'?'active':''}" onclick="mobileFilter='pendent';renderMobileSessionsCards(document.getElementById('mobile-content'));renderMobileSessionsToolbar(document.getElementById('mobile-toolbar'))">⚠ Pendents (${pendingCount})</span>
    </div>
  `;
}

function renderMobileSessionsCards(container) {
  const month = getCurrentMonth();
  const isClosed = !!month.closed;
  const active = (month.clients||[]).filter(c => c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament');

  let filtered = active.slice();
  if (mobileSearch) {
    const q = mobileSearch.toLowerCase();
    filtered = filtered.filter(c => c.name.toLowerCase().includes(q));
  }
  if (mobileFilter === 'pagat')   filtered = filtered.filter(c => c.estat === '02 Pagat');
  if (mobileFilter === 'pendent') filtered = filtered.filter(c => c.estat === '01 Pendent');

  filtered.sort((a,b) => {
    const ca = a.cat||'01', cb = b.cat||'01';
    if (ca !== cb) return ca.localeCompare(cb);
    return a.name.localeCompare(b.name);
  });

  let lastCat = null;
  let cardsHtml = '';
  filtered.forEach(c => {
    const cat = c.cat||'01';
    if (cat !== lastCat) {
      const catInfo = CATEGORIES.find(x=>x.id===cat)||CATEGORIES[0];
      cardsHtml += `<div class="mobile-cat-header"><span class="${catInfo.cls} cat-badge">${catInfo.label}</span></div>`;
      lastCat = cat;
    }
    const total = clientTotal(c);
    const pending = clientPending(c);
    const isPending = c.estat === '01 Pendent';
    const isAlert   = c.estat === '87 Excés Pagament' || c.estat === '88 Sense Tarifa';
    const pct = c.sessions > 0 ? Math.min(100, (c.sessionsDone||0)/c.sessions*100) : 0;

    cardsHtml += `<div class="mobile-client-card">
      <div class="mobile-client-name ${isPending?'pending':''}" style="${isAlert?'color:var(--red)':''}">${escH(c.name)}</div>
      <div class="mobile-client-meta">
        <span class="mobile-meta-item">💰 ${fmt(c.paid||0)}</span>
        ${clientEstatBadge(c)}
        <span class="mobile-meta-item">${fmt(clientTotal(c))} total</span>
      </div>
      <div style="height:3px;background:var(--surface3);border-radius:2px;margin-bottom:10px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:2px"></div>
      </div>
      <div class="mobile-controls">
        ${!isClosed ? `
        <div class="mobile-control-group">
          <span class="mobile-control-label">Contractades</span>
          <button class="mobile-btn minus" onclick="updateSessions('${c.id}',-1);renderMobileContent()">−</button>
          <span class="mobile-count">${c.sessions}</span>
          <button class="mobile-btn plus" onclick="updateSessions('${c.id}',+1);renderMobileContent()">+</button>
        </div>
        <div class="mobile-control-group">
          <span class="mobile-control-label">Realitzades</span>
          <button class="mobile-btn minus" onclick="updateSessionsDone('${c.id}',-1);renderMobileContent()">−</button>
          <span class="mobile-count">${c.sessionsDone||0}</span>
          <button class="mobile-btn plus" onclick="updateSessionsDone('${c.id}',+1);renderMobileContent()">+</button>
        </div>
        <div class="mobile-control-group">
          <span class="mobile-control-label">Pagat €</span>
          <input type="number" class="mobile-paid-input" value="${c.paid||0}" min="0" step="0.01"
            onchange="updatePaid('${c.id}',this.value);renderMobileContent()"
            onkeydown="if(event.key==='Enter')this.blur()"
            onfocus="this.select()" />
        </div>
        ` : `
        <div style="font-size:12px;color:var(--text3);font-family:var(--font-mono)">Sessions: ${c.sessionsDone||0}/${c.sessions} · Pagat: ${fmt(c.paid||0)}</div>
        `}
      </div>
    </div>`;
  });

  container.innerHTML = filtered.length === 0
    ? '<div class="mobile-empty"><div class="icon">🔍</div><p>Cap client trobat</p></div>'
    : cardsHtml;
}

  const pending = (month.clients||[])

  container.innerHTML = `

      <div class="mobile-kpi" style="flex:2">
        <div class="mobile-kpi-label">Total Pendent</div>
        <div class="mobile-kpi-value" style="color:var(--orange)">${fmt(totalPending)}</div>

let gdriveLastSaved  = null;

// ── UI helpers ──
function gdriveSetStatus(type, text) {
  const dot  = document.getElementById('gdrive-dot');
  const span = document.getElementById('gdrive-status-text');
  const btn  = document.getElementById('gdrive-btn');
  const sync = document.getElementById('gdrive-sync-btn');
  if (!dot) return;
  dot.className = 'gdrive-dot ' + type;
  if (type === 'connected') {
    span.textContent = text;
    span.style.color = 'var(--accent)';
    btn.textContent  = '🔓';
    btn.title        = 'Desconnectar Google Drive';
    sync.style.display = 'inline';
  } else if (type === 'syncing') {
    span.textContent = '↑';
    span.style.color = 'var(--blue)';
    sync.style.display = 'none';
  } else if (type === 'error') {
    span.textContent = 'Error';
    span.style.color = 'var(--red)';
    btn.textContent  = '🔗';
    sync.style.display = 'none';
  } else {
    span.textContent = 'Drive';
    span.style.color = 'var(--text3)';
    btn.textContent  = '🔗';
    btn.title        = 'Connectar amb Google Drive';
    sync.style.display = 'none';
  }
}

function gdriveAction() {
  if (gdriveToken) {
    // Desconnectar
    if (confirm('Desconnectar Google Drive? Les dades es continuaran guardant localment.')) {
      gdriveToken  = null;
      gdriveFileId = null;
      localStorage.removeItem('gdrive_token');
      localStorage.removeItem('goals_gdrive_was_connected');
      gdriveSetStatus('offline', 'No connectat a Google Drive');
    }
  } else {
    gdriveConnect();
  }
}

function gdriveConnect() {
  gdriveSetStatus('syncing', 'Connectant...');
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope:     GDRIVE_SCOPE,
    callback:  async (resp) => {
      if (resp.error) {
        gdriveSetStatus('error', 'Error en connectar: ' + resp.error);
        return;
      }
      gdriveToken = resp.access_token;
      localStorage.setItem('gdrive_token_expiry', Date.now() + (resp.expires_in * 1000));
      gdriveSetStatus('syncing', 'Carregant dades del Drive...');
      await gdriveLoadOrCreate();
    }
  });
  client.requestAccessToken();
}

async function gdriveLoadOrCreate() {
  try {
    // Buscar fitxer existent a appDataFolder
    const search = await fetch(
      'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27' + GDRIVE_FILE_NAME + '%27&fields=files(id,name,modifiedTime)',
      { headers: { Authorization: 'Bearer ' + gdriveToken } }
    );
    const data = await search.json();

    if (data.files && data.files.length > 0) {
      gdriveFileId = data.files[0].id;
      // Carregar dades del Drive
      const fileResp = await fetch(
        'https://www.googleapis.com/drive/v3/files/' + gdriveFileId + '?alt=media',
        { headers: { Authorization: 'Bearer ' + gdriveToken } }
      );
      const driveData = await fileResp.json();

      // Comparar amb localStorage — usar el més recent
      const localRaw  = localStorage.getItem(STORAGE_KEY);
      const driveDate = new Date(data.files[0].modifiedTime).getTime();
      const localDate = parseInt(localStorage.getItem('goals_last_saved') || '0');

      if (driveDate > localDate || !localRaw) {
        // Drive és més nou — carregar del Drive
        DB = recalculateAllEstats(driveData);
        // Recalcular estats
        Object.keys(DB.months || {}).forEach(mk => {
          (DB.months[mk].clients || []).forEach(c => {
            if (!c.cat) c.cat = '01';
            if (c.descompte == null) c.descompte = 0;
            if (c.notes === 'Pendent pagament' || c.notes === 'Pendent de pagament') c.notes = '';
            if (c.estat !== '99 No Aplica' && c.estat !== '88 Sense Tarifa' && c.estat !== '87 Excés Pagament') {
              const price = c.priceOverride != null ? c.priceOverride : getPrice(c.sessions, c.cat);
              const base  = price * c.sessions;
              const total = c.descompte > 0 ? base * (1 - c.descompte / 100) : base;
              const totalR = Math.round(total * 100) / 100;
              const paidR  = Math.round((c.paid || 0) * 100) / 100;
              c.estat = Math.max(0, Math.round((totalR - paidR) * 100) / 100) > 0 ? '01 Pendent' : '02 Pagat';
            }
          });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        const modStr = new Date(driveDate).toLocaleTimeString('ca-ES', {hour:'2-digit',minute:'2-digit'});
        gdriveSetStatus('connected', 'Drive connectat · Carregat ' + modStr);
        render();
        toast('Dades carregades de Google Drive ✓');
      } else {
        // Local és més nou — pujar al Drive
        gdriveSetStatus('syncing', 'Pujant dades locals al Drive...');
        await gdriveSaveNow();
      }
    } else {
      // No existeix — crear fitxer nou
      gdriveSetStatus('syncing', 'Creant fitxer al Drive...');
      await gdriveSaveNow();
    }
  } catch(e) {
    console.error('GDrive error:', e);
    gdriveSetStatus('error', 'Error: ' + e.message);
  }
}

async function gdriveSaveNow() {
  if (!gdriveToken) return;
  try {
    const content = JSON.stringify(DB);
    const metadata = { name: GDRIVE_FILE_NAME, parents: ['appDataFolder'] };

    let resp;
    if (gdriveFileId) {
      // Actualitzar fitxer existent
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({})], {type:'application/json'}));
      form.append('file',     new Blob([content],           {type:'application/json'}));
      resp = await fetch(
        'https://www.googleapis.com/upload/drive/v3/files/' + gdriveFileId + '?uploadType=multipart',
        { method: 'PATCH', headers: { Authorization: 'Bearer ' + gdriveToken }, body: form }
      );
    } else {
      // Crear fitxer nou
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
      form.append('file',     new Blob([content],                   {type:'application/json'}));
      resp = await fetch(
        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
        { method: 'POST', headers: { Authorization: 'Bearer ' + gdriveToken }, body: form }
      );
      const newFile = await resp.json();
      gdriveFileId = newFile.id;
    }

    if (resp.ok) {
      gdriveLastSaved = new Date();
      localStorage.setItem('goals_last_saved', Date.now().toString());
      const timeStr = gdriveLastSaved.toLocaleTimeString('ca-ES', {hour:'2-digit',minute:'2-digit'});
      gdriveSetStatus('connected', timeStr);
      // Toast discret
      const t = document.createElement('div');
      t.textContent = '☁️ Drive guardat ' + timeStr;
      t.style.cssText = 'position:fixed;bottom:70px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text3);padding:6px 12px;border-radius:var(--radius-sm);font-size:11px;font-family:var(--font-mono);z-index:999;opacity:1;transition:opacity 1s';
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),1000); }, 2500);
    } else {
      gdriveSetStatus('error', 'Error en guardar al Drive');
    }
  } catch(e) {
    console.error('GDrive save error:', e);
    gdriveSetStatus('error', 'Error en guardar: ' + e.message);
  }
}

// Guardar amb debounce (espera 2s després del darrer canvi)
function gdriveSave() {
  if (!gdriveToken) return;
  gdriveSetStatus('syncing', 'Guardant...');
  clearTimeout(gdriveSaveTimer);
  gdriveSaveTimer = setTimeout(gdriveSaveNow, 2000);
}

function gdriveSyncNow() {
  if (!gdriveToken) { gdriveConnect(); return; }
  gdriveSetStatus('syncing', 'Sincronitzant...');
  gdriveSaveNow();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════

function changeMonth(val) {
  DB.currentMonth = val;
  saveData();
  if (isMobileView) renderMobile();
  else render();
}

function showSplash(content) {
  const splash = document.getElementById('splash-screen');
  splash.style.display = 'flex';
  document.getElementById('splash-content').innerHTML = content;
}

function hideSplash() {
  const splash = document.getElementById('splash-screen');
  splash.style.transition = 'opacity 0.4s';
  setTimeout(() => { splash.style.opacity = '0'; }, 50);
  setTimeout(() => { splash.style.display = 'none'; splash.style.opacity = '1'; }, 500);
}

function launchApp() {
  hideSplash();
  initViewMode();
  if (!isMobileView) render();
}

async function initApp() {
  showSplash('<div style="color:#555;font-size:13px;font-family:var(--font-mono)">Iniciant...</div>');

  if (typeof google === 'undefined' || !google.accounts) {
    showSplash(
      '<div style="color:#e57;font-size:13px;font-family:var(--font-mono);text-align:center;margin-bottom:8px">\u26a0 Sense connexi\u00f3 a internet</div>' +
      '<div style="color:#555;font-size:11px;font-family:var(--font-mono);text-align:center;margin-bottom:20px">Es mostraran les dades locals</div>' +
      '<button onclick="launchApp()" style="background:var(--accent);color:#0f0f0f;border:none;padding:12px 28px;border-radius:10px;font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;width:100%">Continuar offline</button>'
    );
    return;
  }

  const hadToken = localStorage.getItem('goals_gdrive_was_connected');
  if (hadToken) {
    showSplash('<div style="color:#555;font-size:13px;font-family:var(--font-mono)">\u2601\ufe0f Connectant al Drive...</div>');
    try {
      await gdriveConnectSilent();
      return;
    } catch(e) {
      // fall through to connect screen
    }
  }

  showConnectScreen();
}

function showConnectScreen() {
  showSplash(
    '<div style="color:#888;font-size:13px;font-family:var(--font-sans);text-align:center;line-height:1.6;margin-bottom:16px">Connecta amb Google Drive per<br>carregar les dades actualitzades</div>' +
    '<button onclick="gdriveConnectFromSplash()" style="background:var(--accent);color:#0f0f0f;border:none;padding:14px 28px;border-radius:10px;font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px">' +
    '<span>\u2601\ufe0f</span> Connectar amb Google Drive</button>' +
    '<button onclick="launchApp()" style="background:transparent;color:#444;border:1px solid #333;padding:11px 28px;border-radius:10px;font-family:var(--font-sans);font-size:13px;cursor:pointer;width:100%;margin-top:8px">Continuar offline</button>'
  );
}

async function gdriveConnectSilent() {
  return new Promise((resolve, reject) => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      prompt: '',
      callback: async (resp) => {
        if (resp.error) { reject(resp.error); return; }
        gdriveToken = resp.access_token;
        localStorage.setItem('goals_gdrive_was_connected', '1');
        showSplash('<div style="color:var(--accent);font-size:13px;font-family:var(--font-mono)">\u2601\ufe0f Carregant dades...</div>');
        await gdriveLoadOrCreate();
        launchApp();
        resolve();
      }
    });
    client.requestAccessToken();
  });
}

function gdriveConnectFromSplash() {
  showSplash('<div style="color:#555;font-size:13px;font-family:var(--font-mono)">\u2601\ufe0f Connectant...</div>');
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: async (resp) => {
      if (resp.error) {
        showSplash(
          '<div style="color:#e57;font-size:13px;text-align:center;margin-bottom:16px">Error: ' + resp.error + '</div>' +
          '<button onclick="gdriveConnectFromSplash()" style="background:var(--accent);color:#0f0f0f;border:none;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;width:100%">Tornar a intentar</button>' +
          '<button onclick="launchApp()" style="background:transparent;color:#444;border:1px solid #333;padding:10px 28px;border-radius:10px;font-size:13px;cursor:pointer;width:100%;margin-top:8px">Continuar offline</button>'
        );
        return;
      }
      gdriveToken = resp.access_token;
      localStorage.setItem('goals_gdrive_was_connected', '1');
      showSplash('<div style="color:var(--accent);font-size:13px;font-family:var(--font-mono)">\u2601\ufe0f Carregant dades del Drive...</div>');
      await gdriveLoadOrCreate();
      launchApp();
    }
  });
  client.requestAccessToken();
}

window.addEventListener('load', () => { setTimeout(initApp, 500); });

window.addEventListener('resize', () => {
  const shouldBeMobile = detectMobile();
  if (shouldBeMobile && !isMobileView) activateMobileView();
});
</script>
